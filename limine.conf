TERM_MARGIN: 40
TERM_MARGIN_GRADIENT: 40
WALLPAPER: boot():/liminebg.bmp
WALLPAPER_STYLE: stretched
TIMEOUT: 5
SERIAL: yes

/Astral (nvme0n1, ext2)
PROTOCOL: limine
KERNEL_PATH: boot():/astral
KERNEL_CMDLINE: rootfs=ext2 root=nvme0n1 init=/sbin/openrc-init
COMMENT: "The Astral operating system"

/Astral (initrd)
PROTOCOL: limine
KERNEL_PATH: boot():/astral
MODULE_PATH: boot():/initrd
KERNEL_CMDLINE: initrd rootfs=tmpfs init=/sbin/openrc-init
COMMENT: "The Astral operating system"
