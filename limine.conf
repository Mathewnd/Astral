TERM_MARGIN: 40
TERM_MARGIN_GRADIENT: 40
WALLPAPER: boot():/liminebg.bmp
WALLPAPER_STYLE: stretched
TIMEOUT: 5
SERIAL: yes

/Astral (X.org, nvme0n1, ext2)
PROTOCOL: limine
KERNEL_PATH: boot():/astral
KERNEL_CMDLINE: rootfs=ext2 root=nvme0n1 initarg=withx
COMMENT: "The Astral operating system"

/Astral (login prompt, nvme0n1, ext2)
PROTOCOL: limine
KERNEL_PATH: boot():/astral
KERNEL_CMDLINE: rootfs=ext2 root=nvme0n1 initarg=withlogin
COMMENT: "The Astral operating system"

/Astral (root shell, nvme0n1, ext2)
PROTOCOL: limine
KERNEL_PATH: boot():/astral
KERNEL_CMDLINE: rootfs=ext2 root=nvme0n1
COMMENT: "The Astral operating system"

/Astral (root shell, initrd)
PROTOCOL: limine
KERNEL_PATH: boot():/astral
MODULE_PATH: boot():/initrd
KERNEL_CMDLINE: initrd rootfs=tmpfs
COMMENT: "The Astral operating system"
